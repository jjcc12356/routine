<style>
:root{--px:50%;--py:50%;--accent:99,243,255;--accent2:169,124,255}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#050611;overscroll-behavior:none}html,body{margin:0;width:100%;min-height:100%}body{overflow:hidden;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 16%,#1d2d60 0,transparent 34%),radial-gradient(circle at 86% 22%,#47206b 0,transparent 32%),radial-gradient(circle at 48% 86%,#10394d 0,transparent 40%),linear-gradient(150deg,#040510,#080a19 45%,#050611);overscroll-behavior:none}button,input{font:inherit}button{-webkit-user-select:none;user-select:none}.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}.orb{position:absolute;border-radius:9999px;filter:blur(18px);opacity:.62;mix-blend-mode:screen;will-change:transform;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}.a{width:min(68vw,620px);aspect-ratio:1;left:-22vw;top:-15%;background:radial-gradient(circle at 40% 40%,rgba(89,238,255,.92),rgba(49,82,255,.48) 38%,transparent 72%);animation:a 17s ease-in-out infinite alternate}.b{width:min(76vw,720px);aspect-ratio:1;right:-30vw;top:12%;background:radial-gradient(circle at 50% 42%,rgba(255,83,202,.82),rgba(126,73,255,.50) 42%,transparent 72%);animation:b 21s ease-in-out infinite alternate}.c{width:min(86vw,820px);aspect-ratio:1;left:12%;bottom:-42%;background:radial-gradient(circle,rgba(52,255,199,.56),rgba(21,132,255,.38) 44%,transparent 72%);animation:c 25s ease-in-out infinite alternate}.d{width:min(46vw,430px);aspect-ratio:1;left:36%;top:24%;opacity:.35;background:radial-gradient(circle,rgba(255,222,114,.55),rgba(255,95,180,.25) 48%,transparent 74%);animation:d 15s ease-in-out infinite alternate}@keyframes a{to{transform:translate3d(18vw,16%,0) scale(1.18) rotate(16deg)}}@keyframes b{to{transform:translate3d(-2 <body>
<main id="app" class="relative min-h-[100svh] w-full overflow-hidden isolate bg-space">

  <header class="pointer-events-none absolute inset-x-0 top-0 z-20 safe-top px-4 sm:px-6"><div class="mx-auto flex max-w-3xl items-start justify-between gap-3"><div class="pointer-events-auto"><div class="glass-panel inline-flex items-center gap-2 rounded-full px-3 py-2"><span id="dot" class="size-2 rounded-full bg-cyan shadow-[0_0_18px_rgba(99,243,255,.8)]"></span><span id="mode" class="text-[10px] font-semibold tracking-[.2em] text-white/70">ATTRACT</span></div><h1 class="mt-3 text-glow text-[clamp(1.5rem,7vw,2.8rem)] font-semibold leading-none tracking-[-.055em]">Gravity <span class="bg-gradient-to-r from-cyan-200 via-white to-violet-200 bg-clip-text text-transparent">Fluid</span></h1><p class="mt-2 max-w-[275px] text-[11px] leading-relaxed tracking-wide text-white/45">触摸并拖动空间 · 粒子会围绕你的指尖形成实时引力流场</p></div><div class="pointer-events-auto glass-panel flex gap-3 rounded-2xl px-3 py-2.5"><div><div class="text-[9px] uppercase tracking-[.18em] text-white/35">Engine</div><div class="mt-0.5"><span id="fps" class="font-mono text-sm font-semibold">60</span><span class="ml-1 text-[9px] text-white/35">FPS</span></div></div><div class="w-px bg-white/10"></div><div><div class="text-[9px] uppercase tracking-[.18em] text-white/35">Nodes</div><div id="count" class="mt-0.5 font-mono text-sm font-semibold">0</div></div></div></div></header>
  <div id="hint" class="pointer-events-none absolute left-1/2 top-[48%] z-10 -translate-x-1/2 -translate-y-1/2 text-center transition-opacity duration-500 gpu-layer"><div class="mx-auto flex size-16 items-center justify-center rounded-full border border-white/10 bg-white/[.035] backdrop-blur-xl gpu-layer"><div class="size-5 rounded-full border border-cyan-100/60 bg-cyan-200/20 shadow-[0_0_28px_rgba(99,243,255,.55)]"></div></div><div class="mt-4 text-[10px] uppercase tracking-[.28em] text-white/35">Touch the field</div></div>

</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:true,desynchronized:true}),app=$('app');if(!ctx)return;
const ui={fps:$('fps'),count:$('count'),hint:$('hint'),mode:$('mode'),dot:$('dot'),modeBtn:$('modeBtn'),burstBtn:$('burstBtn'),pauseBtn:$('pauseBtn'),panel:$('panel'),panelBtn:$('panelBtn'),chev:$('chev'),g:$('g'),gVal:$('gVal'),v:$('v'),vVal:$('vVal'),r:$('r'),rVal:$('rVal'),den:$('den'),dVal:$('dVal'),reset:$('reset'),quality:$('quality')};
const cfg={gravity:1.15,viscosity:.982,radius:88,density:1,pointerRadius:245,flow:.014,cohesion:.0015,swirl:.032,maxSpeed:4.6,attract:true};
const st={w:1,h:1,dpr:1,p:[],grid:new Map(),run:true,last:performance.now(),frames:0,fpsAt:performance.now(),fps:60,q:1,cool:0,interacted:false};const touches=new Map();const mouse={x:0,y:0,lastX:0,lastY:0,vx:0,vy:0,active:false,pressure:1};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
class P{constructor(){this.x=rnd(0,st.w);this.y=rnd(0,st.h);let a=Math.random()*Math.PI*2,s=rnd(.05,.55);this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.ax=this.ay=0;this.rad=rnd(1,2.2);this.phase=Math.random()*Math.PI*2;this.depth=rnd(.55,1.25)}force(x,y){this.ax+=x;this.ay+=y}update(dt){this.vx+=this.ax*dt;this.vy+=this.ay*dt;this.ax=this.ay=0;let damp=Math.pow(cfg.viscosity,dt);this.vx*=damp;this.vy*=damp;let s=Math.hypot(this.vx,this.vy);if(s>cfg.maxSpeed){let f=cfg.maxSpeed/s;this.vx*=f;this.vy*=f}this.x+=this.vx*dt;this.y+=this.vy*dt;let m=16;if(this.x<-m)this.x=st.w+m;if(this.x>st.w+m)this.x=-m;if(this.y<-m)this.y=st.h+m;if(this.y>st.h+m)this.y=-m}}
function baseCount(){let n=Math.round(st.w*st.h/5200),small=Math.min(st.w,st.h)<600;n=small?clamp(n,82,155):clamp(n,115,245);if(navigator.deviceMemory&&navigator.deviceMemory<=4)n*=.82;if(matchMedia('(prefers-reduced-motion: reduce)').matches)n*=.7;return Math.round(n)}function reconcile(){let n=clamp(Math.round(baseCount()*cfg.density*st.q),42,280);while(st.p.length<n)st.p.push(new P);if(st.p.length>n)st.p.length=n;ui.count.textContent=st.p.length}
function resize(){let r=app.getBoundingClientRect();st.w=Math.max(1,r.width);st.h=Math.max(1,r.height);st.dpr=Math.min(Math.max(1,window.devicePixelRatio||1),2.5);canvas.width=Math.round(st.w*st.dpr);canvas.height=Math.round(st.h*st.dpr);canvas.style.width=st.w+'px';canvas.style.height=st.h+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(st.dpr,st.dpr);ctx.lineCap='round';ctx.lineJoin='round';reconcile()}
function grid(){st.grid.clear();let c=cfg.radius;st.p.forEach((p,i)=>{let k=Math.floor(p.x/c)+','+Math.floor(p.y/c),b=st.grid.get(k);if(!b)st.grid.set(k,b=[]);b.push(i)})}
function ambient(p,t){let x=p.x/st.w,y=p.y/st.h,A=Math.sin(y*8.3+t*.00034+p.phase),B=Math.cos(x*7.1-t*.00027),C=Math.sin((x+y)*5.2+t*.00018);p.force((A+C*.48)*cfg.flow*p.depth,(B-C*.42)*cfg.flow*p.depth)}
function pointerForce(p){let arr=[...touches.values()].filter(x=>x.active);if(mouse.active)arr.push(mouse);for(const q of arr){let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy,R=cfg.pointerRadius;if(d2>=R*R||d2<.0001)continue;let d=Math.sqrt(d2),nx=dx/d,ny=dy/d,z=1-d/R,f=z*z*(3-2*z),dir=cfg.attract?1:-1,force=cfg.gravity*f*(q.pressure||1)*p.depth*.27;p.force(nx*force*dir,ny*force*dir);let speed=Math.hypot(q.vx,q.vy),sw=cfg.swirl*f*(1+clamp(speed*.018,0,1.8))*(cfg.attract?1:-.72);p.force(-ny*sw,nx*sw);if(speed>1)p.force(q.vx*f*.0018,q.vy*f*.0018)}}
function cohesion(){let c=cfg.radius,r2=c*c;for(let i=0;i<st.p.length;i++){let p=st.p[i],gx=Math.floor(p.x/c),gy=Math.floor(p.y/c),cx=0,cy=0,n=0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){let b=st.grid.get((gx+ox)+','+(gy+oy));if(!b)continue;for(const j of b){if(j===i)continue;let o=st.p[j],dx=o.x-p.x,dy=o.y-p.y;if(dx*dx+dy*dy<=r2){cx+=o.x;cy+=o.y;n++}}}if(n)p.force((cx/n-p.x)*cfg.cohesion,(cy/n-p.y)*cfg.cohesion)}}
function network(){let c=cfg.radius,r2=c*c;ctx.lineWidth=.72;for(let i=0;i<st.p.length;i++){let p=st.p[i],gx=Math.floor(p.x/c),gy=Math.floor(p.y/c);for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){let b=st.grid.get((gx+ox)+','+(gy+oy));if(!b)continue;for(const j of b){if(j<=i)continue;let o=st.p[j],dx=o.x-p.x,dy=o.y-p.y,d2=dx*dx+dy*dy;if(d2>r2)continue;let a=Math.pow(1-Math.sqrt(d2)/c,1.8);ctx.strokeStyle=`rgba(124,210,255,${a*.19})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(o.x,o.y);ctx.stroke()}}}}
function particles(t){ctx.save();ctx.globalCompositeOperation='lighter';for(const p of st.p){let pulse=.82+Math.sin(t*.0018+p.phase)*.18,s=Math.hypot(p.vx,p.vy),gl=clamp(.16+s*.055,.16,.42);ctx.fillStyle=`rgba(75,188,255,${gl*.26})`;ctx.beginPath();ctx.arc(p.x,p.y,p.rad*3.2*pulse,0,Math.PI*2);ctx.fill();let m=(Math.sin(p.phase+t*.0004)+1)*.5;ctx.fillStyle=`rgba(${Math.round(130+90*m)},${Math.round(210+35*(1-m))},255,${.72+p.depth*.15})`;ctx.beginPath();ctx.arc(p.x,p.y,p.rad*pulse,0,Math.PI*2);ctx.fill()}ctx.restore()}
function wells(t){let arr=[...touches.values()].filter(x=>x.active);if(mouse.active)arr.push(mouse);ctx.save();ctx.globalCompositeOperation='lighter';for(const p of arr){let R=78*(1+Math.sin(t*.004)*.035),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);g.addColorStop(0,cfg.attract?'rgba(207,251,255,.34)':'rgba(255,224,250,.31)');g.addColorStop(.16,cfg.attract?'rgba(88,235,255,.14)':'rgba(255,102,211,.14)');g.addColorStop(1,'rgba(88,235,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill()}ctx.restore()}
function perf(t){st.frames++;let e=t-st.fpsAt;if(e<600)return;let f=st.frames*1000/e;st.fps=st.fps*.62+f*.38;ui.fps.textContent=Math.round(st.fps);st.frames=0;st.fpsAt=t;if(st.cool>0){st.cool--;return}if(st.fps<42&&st.q>.62){st.q=Math.max(.62,st.q-.1);reconcile();ui.quality.textContent='Performance Mode';st.cool=5}else if(st.fps>56&&st.q<1){st.q=Math.min(1,st.q+.05);reconcile();if(st.q>=.99)ui.quality.textContent='Adaptive Quality';st.cool=7}}
function tick(t){if(!st.run)return;let dt=Math.min(33.34,Math.max(.1,t-st.last))/16.667;st.last=t;ctx.clearRect(0,0,st.w,st.h);grid();for(const p of st.p){ambient(p,t);pointerForce(p)}if(st.frames%2===0)cohesion();for(const p of st.p)p.update(dt);grid();network();particles(t);wells(t);perf(t);requestAnimationFrame(tick)}
function interacted(){if(st.interacted)return;st.interacted=true;ui.hint.style.opacity='0'}function aura(x,y){document.documentElement.style.setProperty('--px',x/st.w*100+'%');document.documentElement.style.setProperty('--py',y/st.h*100+'%')}
function burst(x=st.w/2,y=st.h/2){let max=Math.min(Math.max(st.w,st.h)*.72,680);for(const p of st.p){let dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);if(!d||d>max)continue;let f=(1.2+Math.random()*2.2)*Math.pow(1-d/max,1.3);p.vx+=dx/d*f;p.vy+=dy/d*f}interacted()}
function touchObj(t){let r=canvas.getBoundingClientRect(),x=t.clientX-r.left,y=t.clientY-r.top;return{x,y,lastX:x,lastY:y,vx:0,vy:0,pressure:t.force>0?t.force:1,active:true}}
canvas.addEventListener('touchstart',e=>{interacted();for(const t of e.changedTouches){let p=touchObj(t);touches.set(t.identifier,p);aura(p.x,p.y)}},{passive:true});canvas.addEventListener('touchmove',e=>{let r=canvas.getBoundingClientRect();for(const t of e.changedTouches){let p=touches.get(t.identifier)||touchObj(t),x=t.clientX-r.left,y=t.clientY-r.top;p.vx=x-p.x;p.vy=y-p.y;p.lastX=p.x;p.lastY=p.y;p.x=x;p.y=y;p.pressure=t.force>0?t.force:1;touches.set(t.identifier,p);aura(x,y)}},{passive:true});canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier)},{passive:true});canvas.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)touches.delete(t.identifier)},{passive:true});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;Object.assign(mouse,{x,y,lastX:x,lastY:y,vx:0,vy:0,active:true});interacted();aura(x,y)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;mouse.vx=x-mouse.x;mouse.vy=y-mouse.y;mouse.x=x;mouse.y=y;aura(x,y);if(e.pointerType==='mouse'&&matchMedia('(hover:hover)').matches)mouse.active=true});canvas.addEventListener('pointerleave',()=>mouse.active=false);

ui.g.oninput=e=>{cfg.gravity=+e.target.value;ui.gVal.textContent=cfg.gravity.toFixed(2)};ui.v.oninput=e=>{cfg.viscosity=+e.target.value;ui.vVal.textContent=cfg.viscosity.toFixed(3)};ui.r.oninput=e=>{cfg.radius=+e.target.value;ui.rVal.textContent=Math.round(cfg.radius)};ui.den.oninput=e=>{cfg.density=+e.target.value/100;ui.dVal.textContent=e.target.value+'%';reconcile()};ui.reset.onclick=()=>{cfg.gravity=1.15;cfg.viscosity=.982;cfg.radius=88;cfg.density=1;ui.g.value=1.15;ui.v.value=.982;ui.r.value=88;ui.den.value=100;ui.gVal.textContent='1.15';ui.vVal.textContent='0.982';ui.rVal.textContent='88';ui.dVal.textContent='100%';st.q=1;mode(true);st.p=[];reconcile();burst()};
new ResizeObserver(resize).observe(app);window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>requestAnimationFrame(resize),{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.run){st.last=performance.now();requestAnimationFrame(tick)}});resize();mode(true);requestAnimationFrame(tick);
