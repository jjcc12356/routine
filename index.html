<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050611">
<meta name="color-scheme" content="dark">
<title>引力流体宇宙</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme{
  --font-display:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --color-space:#050611;--color-cyan:#63f3ff;--color-violet:#a97cff;--color-pink:#ff6bcc;--color-mint:#71ffd2;
}
@utility gpu-layer{transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden;perspective:1000px}
@utility glass-panel{background:linear-gradient(135deg,rgb(255 255 255/.115),rgb(255 255 255/.045) 55%,rgb(255 255 255/.07));border:1px solid rgb(255 255 255/.13);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 24px 60px rgb(0 0 0/.3),inset 0 1px 0 rgb(255 255 255/.24),inset 0 -1px 0 rgb(255 255 255/.035);transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
@utility glass-button{border:1px solid rgb(255 255 255/.1);background:linear-gradient(145deg,rgb(255 255 255/.1),rgb(255 255 255/.04));box-shadow:inset 0 1px 0 rgb(255 255 255/.16),0 8px 22px rgb(0 0 0/.16);transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
@utility safe-top{padding-top:max(1rem,env(safe-area-inset-top))}
@utility safe-bottom{padding-bottom:max(1rem,env(safe-area-inset-bottom))}
</style>
<style>
:root{--px:50%;--py:50%;--accent:99,243,255;--accent2:169,124,255;--panel-h:44svh}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#050611;overscroll-behavior:none}html,body{margin:0;width:100%;min-height:100%}body{overflow:hidden;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 16%,#1d2d60 0,transparent 34%),radial-gradient(circle at 86% 22%,#47206b 0,transparent 32%),radial-gradient(circle at 48% 86%,#10394d 0,transparent 40%),linear-gradient(150deg,#040510,#080a19 45%,#050611);overscroll-behavior:none}button,input{font:inherit}button{-webkit-user-select:none;user-select:none}.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}.orb{position:absolute;border-radius:9999px;filter:blur(20px);opacity:.6;mix-blend-mode:screen;will-change:transform;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}.orb1{width:min(70vw,640px);aspect-ratio:1;left:-24vw;top:-16%;background:radial-gradient(circle at 40% 40%,rgba(89,238,255,.92),rgba(49,82,255,.46) 38%,transparent 72%);animation:orb1 18s ease-in-out infinite alternate}.orb2{width:min(78vw,740px);aspect-ratio:1;right:-31vw;top:12%;background:radial-gradient(circle at 50% 42%,rgba(255,83,202,.8),rgba(126,73,255,.48) 42%,transparent 72%);animation:orb2 22s ease-in-out infinite alternate}.orb3{width:min(88vw,840px);aspect-ratio:1;left:10%;bottom:-44%;background:radial-gradient(circle,rgba(52,255,199,.54),rgba(21,132,255,.36) 44%,transparent 72%);animation:orb3 26s ease-in-out infinite alternate}.orb4{width:min(48vw,450px);aspect-ratio:1;left:36%;top:25%;opacity:.32;background:radial-gradient(circle,rgba(255,222,114,.52),rgba(255,95,180,.22) 48%,transparent 74%);animation:orb4 16s ease-in-out infinite alternate}@keyframes orb1{to{transform:translate3d(18vw,16%,0) scale(1.18) rotate(16deg)}}@keyframes orb2{to{transform:translate3d(-22vw,19%,0) scale(.88) rotate(-18deg)}}@keyframes orb3{to{transform:translate3d(15vw,-17%,0) scale(1.18)}}@keyframes orb4{to{transform:translate3d(14vw,22%,0) scale(1.15)}}.aura{position:fixed;inset:0;pointer-events:none;background:radial-gradient(330px circle at var(--px) var(--py),rgba(var(--accent),.09),transparent 68%);will-change:background;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}.noise{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E")}#canvas{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:3;touch-action:none;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden;backface-visibility:hidden}.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}.tool{white-space:nowrap;transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}.tool:active,.action-btn:active,.round-btn:active{transform:translate3d(0,0,0) scale(.95)}.tool.active{border-color:rgba(var(--accent),.5);background:linear-gradient(145deg,rgba(var(--accent),.18),rgba(var(--accent2),.08));box-shadow:0 0 0 1px rgba(var(--accent),.08),0 0 26px rgba(var(--accent),.12),inset 0 1px 0 rgba(255,255,255,.18)}.panel{max-height:var(--panel-h);transition:transform .48s cubic-bezier(.22,1,.36,1);will-change:transform;transform:translate3d(-50%,0,0);-webkit-backface-visibility:hidden}.panel.closed{transform:translate3d(-50%,calc(100% - 132px),0)!important}.range{width:100%;height:24px;appearance:none;-webkit-appearance:none;background:transparent}.range::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,rgba(var(--accent),.8),rgba(var(--accent2),.72));box-shadow:inset 0 1px 2px rgba(0,0,0,.24)}.range::-webkit-slider-thumb{width:19px;height:19px;margin-top:-7.5px;border:1px solid rgba(255,255,255,.8);border-radius:50%;appearance:none;-webkit-appearance:none;background:#effcff;box-shadow:0 0 0 5px rgba(var(--accent),.11),0 2px 10px rgba(0,0,0,.28)}.range::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(90deg,rgba(var(--accent),.8),rgba(var(--accent2),.72))}.range::-moz-range-thumb{width:19px;height:19px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:#effcff}.modal{transition:opacity .28s ease,visibility .28s ease;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}.modal.hidden-modal{opacity:0;visibility:hidden;pointer-events:none}.guide-card{transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .25s ease}.toast{transform:translate3d(-50%,-18px,0);opacity:0;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s ease;pointer-events:none}.toast.show{transform:translate3d(-50%,0,0);opacity:1}.challenge{transform:translate3d(-50%,-18px,0);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s ease}.challenge.show{transform:translate3d(-50%,0,0);opacity:1;pointer-events:auto}.pulse-ring{animation:pulseRing 1.8s ease-out infinite;transform:translate3d(0,0,0);-webkit-backface-visibility:hidden}@keyframes pulseRing{0%{transform:scale(.72);opacity:.7}75%,100%{transform:scale(1.45);opacity:0}}.theme-chip.active,.preset-chip.active{border-color:rgba(var(--accent),.45);background:rgba(var(--accent),.12);color:rgba(255,255,255,.92)}@media(max-width:520px){:root{--panel-h:46svh}.desktop-copy{display:none}}@media(prefers-reduced-motion:reduce){.orb,.pulse-ring{animation:none!important}.panel,.modal,.toast,.challenge{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app" class="relative min-h-[100svh] w-full overflow-hidden isolate bg-space">
  <div class="ambient z-0 gpu-layer" aria-hidden="true"><div class="orb orb1 gpu-layer"></div><div class="orb orb2 gpu-layer"></div><div class="orb orb3 gpu-layer"></div><div class="orb orb4 gpu-layer"></div></div>
  <div class="aura z-[1] gpu-layer" aria-hidden="true"></div><div class="noise"></div>
  <canvas id="canvas" aria-label="交互式引力粒子流体宇宙"></canvas>

  <header class="pointer-events-none absolute inset-x-0 top-0 z-20 safe-top px-4 sm:px-6">
    <div class="mx-auto flex max-w-4xl items-start justify-between gap-3">
      <div class="pointer-events-auto min-w-0">
        <div class="glass-panel inline-flex items-center gap-2 rounded-full px-3 py-2"><span id="modeDot" class="size-2 rounded-full bg-cyan shadow-[0_0_18px_rgba(99,243,255,.8)]"></span><span id="modeText" class="text-[10px] font-semibold tracking-[.14em] text-white/72">引力吸引</span></div>
        <h1 class="mt-3 text-[clamp(1.45rem,6.8vw,2.8rem)] font-semibold leading-none tracking-[-.055em] [text-shadow:0_0_26px_rgba(99,243,255,.2)]">引力流体<span class="bg-gradient-to-r from-cyan-200 via-white to-violet-200 bg-clip-text text-transparent">宇宙</span></h1>
        <p id="subHint" class="mt-2 max-w-[285px] text-[11px] leading-relaxed tracking-wide text-white/45">触摸并拖动场域，改变粒子的命运</p>
      </div>
      <div class="pointer-events-auto glass-panel flex shrink-0 gap-3 rounded-2xl px-3 py-2.5">
        <div><div class="text-[9px] tracking-[.12em] text-white/35">帧率</div><div id="fps" class="mt-0.5 font-mono text-sm font-semibold tabular-nums">60</div></div><div class="w-px bg-white/10"></div><div><div class="text-[9px] tracking-[.12em] text-white/35">粒子</div><div id="count" class="mt-0.5 font-mono text-sm font-semibold tabular-nums">0</div></div><div class="w-px bg-white/10"></div><div><div class="text-[9px] tracking-[.12em] text-white/35">最高分</div><div id="best" class="mt-0.5 font-mono text-sm font-semibold tabular-nums">0</div></div>
      </div>
    </div>
  </header>

  <div id="challengeBar" class="challenge glass-panel absolute left-1/2 top-[116px] z-30 flex items-center gap-3 rounded-full px-4 py-2.5 sm:top-[122px]">
    <span class="size-2 rounded-full bg-pink shadow-[0_0_14px_rgba(255,107,204,.8)]"></span><span class="text-[10px] text-white/55">黑洞吞噬挑战</span><strong id="timer" class="font-mono text-sm tabular-nums">30.0</strong><span class="h-4 w-px bg-white/10"></span><span class="text-[10px] text-white/45">得分</span><strong id="score" class="font-mono text-sm tabular-nums text-cyan-100">0</strong><span id="combo" class="rounded-full bg-white/[.07] px-2 py-1 text-[9px] text-white/50">连击 ×1</span>
  </div>

  <div id="centerHint" class="pointer-events-none absolute left-1/2 top-[47%] z-10 -translate-x-1/2 -translate-y-1/2 text-center transition-opacity duration-500 gpu-layer">
    <div class="relative mx-auto flex size-16 items-center justify-center rounded-full border border-white/10 bg-white/[.035] backdrop-blur-xl gpu-layer"><div class="pulse-ring absolute inset-2 rounded-full border border-cyan-200/30"></div><div class="size-5 rounded-full border border-cyan-100/60 bg-cyan-200/20 shadow-[0_0_28px_rgba(99,243,255,.55)]"></div></div>
    <div class="mt-4 text-[10px] tracking-[.22em] text-white/35">触摸场域开始探索</div>
  </div>

  <aside class="absolute right-3 top-[43%] z-30 flex -translate-y-1/2 flex-col gap-2 sm:right-5">
    <button id="guideBtn" class="round-btn glass-button flex size-11 items-center justify-center rounded-2xl text-sm" aria-label="打开玩法指引" title="玩法指引">?</button>
    <button id="soundBtn" class="round-btn glass-button flex size-11 items-center justify-center rounded-2xl text-sm" aria-label="切换声音" title="声音">♫</button>
    <button id="pauseBtn" class="round-btn glass-button flex size-11 items-center justify-center rounded-2xl text-sm" aria-label="暂停或继续" title="暂停或继续">Ⅱ</button>
  </aside>

  <div id="toast" class="toast glass-panel fixed left-1/2 top-[max(1rem,env(safe-area-inset-top))] z-[80] max-w-[88vw] rounded-full px-4 py-2.5 text-center text-[11px] text-white/80"></div>

  <section id="panel" class="panel glass-panel absolute bottom-0 left-1/2 z-40 w-[calc(100%-0.75rem)] max-w-2xl rounded-t-[28px] px-3 pt-2 safe-bottom sm:bottom-3 sm:rounded-[28px] sm:px-4">
    <button id="panelBtn" class="flex w-full items-center justify-between py-2.5">
      <div class="flex items-center gap-3"><span class="flex size-8 items-center justify-center rounded-xl border border-white/10 bg-white/[.055] text-xs">✦</span><div><div class="text-left text-xs font-medium">宇宙实验台</div><div id="panelHint" class="mt-0.5 text-left text-[9px] tracking-[.12em] text-white/32">选择工具后直接触摸画布</div></div></div><span id="chev" class="text-sm text-white/50">⌃</span>
    </button>

    <div class="no-scrollbar flex gap-2 overflow-x-auto pb-3" id="tools">
      <button class="tool glass-button active rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="attract">◎ 引力</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="repel">⊙ 斥力</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="vortex">↻ 涡旋</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="freeze">❄ 冻结</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="blackhole">● 黑洞</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="whitehole">○ 白洞</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="orbit">◌ 轨道星</button>
      <button class="tool glass-button rounded-xl px-3 py-2 text-[10px] text-white/75" data-tool="fountain">↑ 粒子喷泉</button>
    </div>

    <div class="no-scrollbar max-h-[calc(var(--panel-h)-124px)] overflow-y-auto border-t border-white/[.07] pt-3">
      <div class="grid grid-cols-4 gap-2">
        <button id="burstBtn" class="action-btn glass-button rounded-xl py-2.5 text-[10px] text-white/65">✦<br><span class="mt-1 inline-block">能量爆发</span></button>
        <button id="rainBtn" class="action-btn glass-button rounded-xl py-2.5 text-[10px] text-white/65">⋮<br><span class="mt-1 inline-block">粒子雨</span></button>
        <button id="ringBtn" class="action-btn glass-button rounded-xl py-2.5 text-[10px] text-white/65">◉<br><span class="mt-1 inline-block">生成星环</span></button>
        <button id="randomBtn" class="action-btn glass-button rounded-xl py-2.5 text-[10px] text-white/65">⌁<br><span class="mt-1 inline-block">随机宇宙</span></button>
      </div>

      <div class="mt-3 flex items-center justify-between gap-2">
        <button id="challengeBtn" class="glass-button flex h-10 flex-1 items-center justify-center rounded-xl text-[10px] font-semibold tracking-wide text-pink-100">30 秒黑洞挑战</button>
        <button id="clearFieldsBtn" class="glass-button h-10 rounded-xl px-3 text-[10px] text-white/55">清除天体</button>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-x-5 gap-y-3">
        <label><div class="flex justify-between text-[10px] text-white/55"><span>引力强度</span><output id="gVal">1.15</output></div><input id="g" class="range" type="range" min=".2" max="3.2" value="1.15" step=".05"></label>
        <label><div class="flex justify-between text-[10px] text-white/55"><span>流体粘性</span><output id="vVal">0.982</output></div><input id="v" class="range" type="range" min=".94" max=".996" value=".982" step=".002"></label>
        <label><div class="flex justify-between text-[10px] text-white/55"><span>网络半径</span><output id="rVal">88</output></div><input id="r" class="range" type="range" min="42" max="150" value="88" step="1"></label>
        <label><div class="flex justify-between text-[10px] text-white/55"><span>粒子密度</span><output id="dVal">100%</output></div><input id="den" class="range" type="range" min="45" max="140" value="100" step="5"></label>
        <label><div class="flex justify-between text-[10px] text-white/55"><span>时间速度</span><output id="tVal">1.00×</output></div><input id="timeScale" class="range" type="range" min=".25" max="2" value="1" step=".05"></label>
        <label><div class="flex justify-between text-[10px] text-white/55"><span>拖尾长度</span><output id="trailVal">35%</output></div><input id="trail" class="range" type="range" min="0" max="82" value="35" step="1"></label>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-3">
        <div><div class="mb-2 text-[9px] tracking-[.14em] text-white/32">视觉主题</div><div class="flex flex-wrap gap-1.5"><button class="theme-chip active rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-theme="aurora">极光</button><button class="theme-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-theme="ocean">深海</button><button class="theme-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-theme="ember">熔星</button><button class="theme-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-theme="galaxy">银河</button></div></div>
        <div><div class="mb-2 text-[9px] tracking-[.14em] text-white/32">物理预设</div><div class="flex flex-wrap gap-1.5"><button class="preset-chip active rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-preset="fluid">流体</button><button class="preset-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-preset="nebula">星云</button><button class="preset-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-preset="chaos">混沌</button><button class="preset-chip rounded-lg border border-white/10 px-2.5 py-1.5 text-[9px] text-white/48" data-preset="orbit">轨道</button></div></div>
      </div>

      <div class="mt-4 flex items-center gap-2 pb-2"><button id="networkBtn" class="glass-button h-9 flex-1 rounded-xl text-[9px] text-white/55">连线：开启</button><button id="resetBtn" class="glass-button h-9 flex-1 rounded-xl text-[9px] text-white/55">重置参数</button><div class="glass-button flex h-9 flex-[1.25] items-center justify-center gap-2 rounded-xl"><span class="size-1.5 rounded-full bg-emerald-300 shadow-[0_0_12px_rgba(110,231,183,.7)]"></span><span id="quality" class="text-[9px] text-white/45">自适应画质</span></div></div>
    </div>
  </section>

  <div id="guideModal" class="modal fixed inset-0 z-[100] flex items-center justify-center bg-black/45 px-4 backdrop-blur-md gpu-layer">
    <div class="guide-card glass-panel w-full max-w-sm rounded-[30px] p-5 sm:p-6">
      <div class="flex items-center justify-between"><span class="rounded-full border border-white/10 bg-white/[.05] px-3 py-1.5 text-[9px] tracking-[.16em] text-white/45">玩法指引</span><button id="closeGuide" class="round-btn flex size-9 items-center justify-center rounded-full border border-white/10 bg-white/[.05] text-sm text-white/55">×</button></div>
      <div id="guideIcon" class="mt-7 flex size-16 items-center justify-center rounded-2xl border border-white/10 bg-white/[.055] text-2xl shadow-[inset_0_1px_0_rgba(255,255,255,.15),0_0_40px_rgba(99,243,255,.08)]">◎</div>
      <h2 id="guideTitle" class="mt-5 text-xl font-semibold tracking-tight">用手指塑造引力</h2>
      <p id="guideText" class="mt-2 min-h-[66px] text-[12px] leading-6 text-white/48">选择“引力、斥力、涡旋或冻结”，然后按住画布拖动。滑动越快，粒子获得的动量越强。</p>
      <div id="guideDots" class="mt-5 flex gap-1.5"></div>
      <button id="guideNext" class="mt-5 h-12 w-full rounded-2xl border border-cyan-200/20 bg-gradient-to-r from-cyan-300/20 to-violet-300/15 text-xs font-semibold text-white/80 shadow-[inset_0_1px_0_rgba(255,255,255,.16)]">下一步</button>
      <button id="guideSkip" class="mt-2 h-9 w-full text-[10px] text-white/32">直接开始探索</button>
    </div>
  </div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),$$=s=>Array.from(document.querySelectorAll(s));
const canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:true,desynchronized:true}),app=$('app');if(!ctx)return;
const ui={fps:$('fps'),count:$('count'),best:$('best'),modeText:$('modeText'),modeDot:$('modeDot'),subHint:$('subHint'),centerHint:$('centerHint'),panel:$('panel'),panelBtn:$('panelBtn'),panelHint:$('panelHint'),chev:$('chev'),guideBtn:$('guideBtn'),soundBtn:$('soundBtn'),pauseBtn:$('pauseBtn'),toast:$('toast'),challengeBar:$('challengeBar'),timer:$('timer'),score:$('score'),combo:$('combo'),challengeBtn:$('challengeBtn'),burst:$('burstBtn'),rain:$('rainBtn'),ring:$('ringBtn'),random:$('randomBtn'),clearFields:$('clearFieldsBtn'),network:$('networkBtn'),reset:$('resetBtn'),quality:$('quality'),g:$('g'),gVal:$('gVal'),v:$('v'),vVal:$('vVal'),r:$('r'),rVal:$('rVal'),den:$('den'),dVal:$('dVal'),timeScale:$('timeScale'),tVal:$('tVal'),trail:$('trail'),trailVal:$('trailVal'),guide:$('guideModal'),guideIcon:$('guideIcon'),guideTitle:$('guideTitle'),guideText:$('guideText'),guideDots:$('guideDots'),guideNext:$('guideNext'),guideSkip:$('guideSkip'),closeGuide:$('closeGuide')};

function randomUniverse(){const names=Object.keys(themes),pres=Object.keys(presets),theme=names[Math.floor(Math.random()*names.length)],preset=pres[Math.floor(Math.random()*pres.length)];setTheme(theme);applyPreset(preset);cfg.gravity=rnd(.5,2.8);cfg.swirl=rnd(.015,.11);syncControls();burst(st.w/2,st.h/2);toast('宇宙参数已随机重组')}
function startChallenge(){st.fields.length=0;st.challenge={active:true,ends:performance.now()+30000,score:0,combo:1,lastEat:0};ui.challengeBar.classList.add('show');ui.challengeBtn.textContent='结束挑战';ui.score.textContent='0';ui.combo.textContent='连击 ×1';setTool('blackhole');for(let i=0;i<45;i++)st.p.push(new P(rnd(0,st.w),rnd(100,st.h-60),rnd(-1,1),rnd(-1,1)));ui.count.textContent=st.p.length;toast('30 秒内放置黑洞，尽可能吞噬粒子');tone(360,.09,'triangle',.05);setTimeout(()=>tone(520,.1,'triangle',.05),100)}
function endChallenge(){if(!st.challenge.active)return;st.challenge.active=false;ui.challengeBar.classList.remove('show');ui.challengeBtn.textContent='30 秒黑洞挑战';const score=st.challenge.score;if(score>st.best){st.best=score;localStorage.setItem('gravity-fluid-best',score);ui.best.textContent=score;toast('新纪录！本次得分 '+score);achievement('newbest','刷新最高纪录')}else toast('挑战结束 · 得分 '+score+' · 最高 '+st.best);tone(240,.1,'triangle',.04);setTimeout(()=>tone(180,.16,'triangle',.03),110);setTool('attract');reconcile()}
function setTheme(name){cfg.theme=name;const t=themes[name];document.documentElement.style.setProperty('--accent',t.a.join(','));document.documentElement.style.setProperty('--accent2',t.b.join(','));$$('.theme-chip').forEach(b=>b.classList.toggle('active',b.dataset.theme===name))}
function applyPreset(name){Object.assign(cfg,presets[name]);$$('.preset-chip').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));syncControls();toast('已切换到“'+({fluid:'流体',nebula:'星云',chaos:'混沌',orbit:'轨道'}[name])+'”预设')}
function syncControls(){ui.g.value=cfg.gravity;ui.v.value=cfg.viscosity;ui.r.value=cfg.radius;ui.gVal.textContent=Number(cfg.gravity).toFixed(2);ui.vVal.textContent=Number(cfg.viscosity).toFixed(3);ui.rVal.textContent=Math.round(cfg.radius)}
function resetAll(){Object.assign(cfg,{gravity:1.15,viscosity:.982,radius:88,density:1,flow:.014,cohesion:.0015,swirl:.032,maxSpeed:4.8,timeScale:1,trail:.35,network:true});ui.den.value=100;ui.dVal.textContent='100%';ui.timeScale.value=1;ui.tVal.textContent='1.00×';ui.trail.value=35;ui.trailVal.textContent='35%';ui.network.textContent='连线：开启';st.q=1;st.fields.length=0;syncControls();reconcile();setTool('attract');setTheme('aurora');$$('.preset-chip').forEach(b=>b.classList.toggle('active',b.dataset.preset==='fluid'));toast('参数已恢复默认')}
$$('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));$$('.theme-chip').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));$$('.preset-chip').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
ui.burst.addEventListener('click',()=>burst());ui.rain.addEventListener('click',particleRain);ui.ring.addEventListener('click',starRing);ui.random.addEventListener('click',randomUniverse);ui.clearFields.addEventListener('click',()=>{st.fields.length=0;toast('已清除所有永久天体')});ui.challengeBtn.addEventListener('click',()=>st.challenge.active?endChallenge():startChallenge());
ui.g.addEventListener('input',e=>{cfg.gravity=Number(e.target.value);ui.gVal.textContent=cfg.gravity.toFixed(2)});ui.v.addEventListener('input',e=>{cfg.viscosity=Number(e.target.value);ui.vVal.textContent=cfg.viscosity.toFixed(3)});ui.r.addEventListener('input',e=>{cfg.radius=Number(e.target.value);ui.rVal.textContent=Math.round(cfg.radius)});ui.den.addEventListener('input',e=>{cfg.density=Number(e.target.value)/100;ui.dVal.textContent=e.target.value+'%';reconcile()});ui.timeScale.addEventListener('input',e=>{cfg.timeScale=Number(e.target.value);ui.tVal.textContent=cfg.timeScale.toFixed(2)+'×'});ui.trail.addEventListener('input',e=>{cfg.trail=Number(e.target.value)/100;ui.trailVal.textContent=e.target.value+'%'});ui.network.addEventListener('click',()=>{cfg.network=!cfg.network;ui.network.textContent='连线：'+(cfg.network?'开启':'关闭')});ui.reset.addEventListener('click',resetAll);
ui.panelBtn.addEventListener('click',()=>{st.panelClosed=!st.panelClosed;ui.panel.classList.toggle('closed',st.panelClosed);ui.chev.textContent=st.panelClosed?'⌃':'⌄'});ui.soundBtn.addEventListener('click',()=>{soundOn=!soundOn;ui.soundBtn.textContent=soundOn?'♫':'×';toast(soundOn?'声音已开启':'声音已关闭');if(soundOn)unlockAudio()});ui.pauseBtn.addEventListener('click',()=>{st.run=!st.run;ui.pauseBtn.textContent=st.run?'Ⅱ':'▶';if(st.run){st.last=performance.now();st.fpsAt=performance.now();st.frames=0;st.frameId=requestAnimationFrame(tick)}else cancelAnimationFrame(st.frameId)});
const guideSteps=[{icon:'◎',title:'用手指塑造引力',text:'选择“引力、斥力、涡旋或冻结”，然后按住画布拖动。滑动越快，粒子获得的动量越强。'},{icon:'●',title:'创造永久天体',text:'选择“黑洞、白洞或轨道星”后点击画布，即可留下永久引力源。最多可同时放置多个天体，组合出复杂轨道。'},{icon:'✦',title:'触发宇宙事件',text:'展开实验台可使用能量爆发、粒子雨、星环和随机宇宙。拖尾、时间速度、主题和物理预设也都能自由调整。'},{icon:'30',title:'挑战你的最高分',text:'开启“30 秒黑洞挑战”，在限定时间内布置黑洞吞噬粒子。连续吞噬会提高连击倍率，并记录最高分。'},{icon:'★',title:'还有隐藏成就',text:'爆发、星环、黑洞、高连击和高分都会解锁成就。现在没有固定答案——把这个场域玩成属于你的宇宙。'}];let guideIndex=0;
function renderGuide(){const s=guideSteps[guideIndex];ui.guideIcon.textContent=s.icon;ui.guideTitle.textContent=s.title;ui.guideText.textContent=s.text;ui.guideDots.innerHTML=guideSteps.map((_,i)=>`<span class="h-1.5 rounded-full transition-all ${i===guideIndex?'w-6 bg-cyan-200/70':'w-1.5 bg-white/15'}"></span>`).join('');ui.guideNext.textContent=guideIndex===guideSteps.length-1?'开始探索':'下一步'}
function openGuide(){guideIndex=0;renderGuide();ui.guide.classList.remove('hidden-modal')}
function closeGuide(){ui.guide.classList.add('hidden-modal');localStorage.setItem('gravity-fluid-guide','1')}
ui.guideNext.addEventListener('click',()=>{if(guideIndex<guideSteps.length-1){guideIndex++;renderGuide();tone(520,.04,'sine',.025)}else closeGuide()});ui.guideSkip.addEventListener('click',closeGuide);ui.closeGuide.addEventListener('click',closeGuide);ui.guideBtn.addEventListener('click',openGuide);
const ro=new ResizeObserver(resize);ro.observe(app);window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>requestAnimationFrame(resize),{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(st.frameId)}else if(st.run){st.last=performance.now();st.fpsAt=performance.now();st.frameId=requestAnimationFrame(tick)}});
resize();setTheme('aurora');setTool('attract');ui.panel.classList.add('closed');st.frameId=requestAnimationFrame(tick);if(localStorage.getItem('gravity-fluid-guide')==='1')ui.guide.classList.add('hidden-modal');else renderGuide();
})();
</script>
</body>
