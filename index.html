<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 智感日程本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Lucide 官方库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        // Firebase 配置
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = window.__app_id || 'default-planner-2026';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useCallback, createElement } = React;

        // --- 极简 Icon 组件：仅通过 data-lucide 占位 ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            // 将 CamelCase 转换为 kebab-case
            const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            return createElement('i', {
                'data-lucide': kebabName,
                className: className,
                'aria-hidden': 'true'
            });
        };

        const MONTH_NAMES = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
        const WEEK_DAYS = ["日", "一", "二", "三", "四", "五", "六"];
        const YEAR = 2026;

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('year'); 
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
            const [selectedDate, setSelectedDate] = useState(null);
            const [tasks, setTasks] = useState({});
            const [habits, setHabits] = useState({});
            const [newTask, setNewTask] = useState('');
            const [syncStatus, setSyncStatus] = useState('synced');

            // --- 核心：确保图标渲染 ---
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [view, selectedMonth, selectedDate, tasks, habits]);

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'users', user.uid, 'plannerData');
                return onSnapshot(q, (snapshot) => {
                    const newTasks = {};
                    const newHabits = {};
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.tasks) newTasks[doc.id] = data.tasks;
                        if (data.habits) newHabits[doc.id] = data.habits;
                    });
                    setTasks(newTasks);
                    setHabits(newHabits);
                    setSyncStatus('synced');
                }, () => setSyncStatus('error'));
            }, [user]);

            const saveToCloud = useCallback(async (dateId, updatedTasks, updatedHabits) => {
                if (!user) return;
                setSyncStatus('syncing');
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'plannerData', dateId);
                    await setDoc(docRef, {
                        tasks: updatedTasks !== undefined ? updatedTasks : (tasks[dateId] || []),
                        habits: updatedHabits !== undefined ? updatedHabits : (habits[dateId] || { earlyRise: false, english: false }),
                        lastUpdated: Date.now()
                    }, { merge: true });
                } catch (err) {
                    setSyncStatus('error');
                }
            }, [user, tasks, habits]);

            const addTask = async () => {
                if (!newTask.trim() || !selectedDate) return;
                const updatedTasks = [...(tasks[selectedDate] || []), { id: Date.now(), text: newTask, completed: false }];
                setNewTask('');
                await saveToCloud(selectedDate, updatedTasks);
            };

            const toggleTask = async (id) => {
                const updatedTasks = tasks[selectedDate].map(t => t.id === id ? { ...t, completed: !t.completed } : t);
                await saveToCloud(selectedDate, updatedTasks);
            };

            const deleteTask = async (id) => {
                const updatedTasks = tasks[selectedDate].filter(t => t.id !== id);
                await saveToCloud(selectedDate, updatedTasks);
            };

            const toggleHabit = async (type) => {
                const current = habits[selectedDate] || { earlyRise: false, english: false };
                await saveToCloud(selectedDate, undefined, { ...current, [type]: !current[type] });
            };

            const habitCount = (type) => Object.values(habits).filter(h => h[type]).length;

            return createElement('div', { className: 'min-h-screen bg-slate-50 p-4 md:p-10 font-sans text-slate-900' }, 
                createElement('div', { className: 'max-w-7xl mx-auto' },
                    // Header
                    createElement('header', { className: 'flex flex-col md:flex-row justify-between items-end mb-12' },
                        createElement('div', { className: 'flex items-center space-x-4' },
                            createElement('div', { className: 'p-3 bg-blue-600 rounded-2xl shadow-xl shadow-blue-200' }, 
                                createElement(Icon, { name: 'Calendar', className: 'w-8 h-8 text-white' })
                            ),
                            createElement('div', null,
                                createElement('h1', { className: 'text-4xl font-black tracking-tighter' }, '2026 智感日程'),
                                createElement('p', { className: 'text-slate-400 font-bold text-xs uppercase tracking-widest' }, 'Cloud Synced System')
                            )
                        ),
                        createElement('div', { className: 'flex bg-white p-1.5 rounded-[1.5rem] shadow-xl border border-slate-100 mt-6 md:mt-0' },
                            createElement('button', { onClick: () => setView('year'), className: `px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition-all ${view === 'year' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}` }, '全年'),
                            createElement('button', { onClick: () => setView('month'), className: `px-6 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition-all ${view !== 'year' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}` }, '计划')
                        )
                    ),

                    // Main View
                    createElement('main', { className: 'pb-32' }, 
                        view === 'year' ? 
                        createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6' },
                            MONTH_NAMES.map((name, idx) => createElement('div', { key: name, onClick: () => { setSelectedMonth(idx); setView('month'); }, className: 'bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-all cursor-pointer group' },
                                createElement('div', { className: 'flex justify-between items-center mb-4' },
                                    createElement('h3', { className: 'text-lg font-bold group-hover:text-blue-600 transition-colors' }, name),
                                    createElement('span', { className: 'text-[10px] font-bold px-2 py-0.5 bg-green-100 text-green-700 rounded-full' }, '2026')
                                ),
                                createElement('div', { className: 'grid grid-cols-7 gap-1' },
                                    WEEK_DAYS.map(d => createElement('div', { key: d, className: 'text-[10px] text-center text-slate-300 font-bold mb-1' }, d)),
                                    Array(new Date(YEAR, idx, 1).getDay()).fill(null).map((_, i) => createElement('div', { key: `e-${i}` })),
                                    Array.from({ length: new Date(YEAR, idx+1, 0).getDate() }).map((_, i) => {
                                        const d = i + 1;
                                        const dateKey = `${YEAR}-${String(idx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                        const habit = habits[dateKey];
                                        return createElement('div', { key: d, className: 'flex items-center justify-center py-0.5' },
                                            createElement('div', { className: `text-[10px] w-5 h-5 flex items-center justify-center rounded-full ${tasks[dateKey]?.length > 0 ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-400'} ${(habit?.earlyRise || habit?.english) ? 'border border-orange-200 bg-orange-50/30' : ''}` }, d)
                                        );
                                    })
                                )
                            ))
                        ) : view === 'month' ?
                        createElement('div', { className: 'bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100' },
                            createElement('div', { className: 'p-6 border-b flex items-center justify-between bg-slate-50/50' },
                                createElement('button', { onClick: () => setView('year'), className: 'flex items-center text-slate-400 font-bold hover:text-blue-600 transition-colors' }, createElement(Icon, { name: 'ChevronLeft', className: 'w-4 h-4 mr-1' }), '返回年度'),
                                createElement('div', { className: 'flex items-center space-x-6' },
                                    createElement('button', { onClick: () => setSelectedMonth(m => Math.max(0, m-1)) }, createElement(Icon, { name: 'ChevronLeft', className: 'w-6 h-6' })),
                                    createElement('h2', { className: 'text-2xl font-black min-w-[120px] text-center tracking-tighter' }, MONTH_NAMES[selectedMonth]),
                                    createElement('button', { onClick: () => setSelectedMonth(m => Math.min(11, m+1)) }, createElement(Icon, { name: 'ChevronRight', className: 'w-6 h-6' }))
                                ),
                                createElement('div', { className: 'flex space-x-2' }, 
                                    createElement(Icon, { name: 'Sun', className: 'w-5 h-5 text-orange-400' }), 
                                    createElement(Icon, { name: 'Languages', className: 'w-5 h-5 text-blue-400' })
                                )
                            ),
                            createElement('div', { className: 'grid grid-cols-7 font-black text-[11px] text-slate-300 uppercase tracking-widest text-center py-4 border-b' },
                                WEEK_DAYS.map(day => createElement('div', { key: day }, day))
                            ),
                            createElement('div', { className: 'grid grid-cols-7 h-[650px]' },
                                Array(new Date(YEAR, selectedMonth, 1).getDay()).fill(null).map((_, i) => createElement('div', { key: `b-${i}`, className: 'border-r border-b bg-slate-50/20' })),
                                Array.from({ length: new Date(YEAR, selectedMonth+1, 0).getDate() }).map((_, i) => {
                                    const d = i + 1;
                                    const dateStr = `${YEAR}-${String(selectedMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                    const h = habits[dateStr] || {};
                                    return createElement('div', { key: d, onClick: () => { setSelectedDate(dateStr); setView('day'); }, className: 'border-r border-b p-3 hover:bg-blue-50/30 cursor-pointer transition-colors group' },
                                        createElement('div', { className: 'flex justify-between' },
                                            createElement('span', { className: 'text-sm font-bold text-slate-400 group-hover:text-blue-600' }, d),
                                            createElement('div', { className: 'flex space-x-0.5' },
                                                h.earlyRise && createElement(Icon, { name: 'Sun', className: 'w-3 h-3 text-orange-400' }),
                                                h.english && createElement(Icon, { name: 'Languages', className: 'w-3 h-3 text-blue-400' })
                                            )
                                        ),
                                        createElement('div', { className: 'mt-2 space-y-1' },
                                            (tasks[dateStr] || []).slice(0, 2).map(t => createElement('div', { key: t.id, className: `text-[10px] truncate px-1.5 py-0.5 rounded-md ${t.completed ? 'bg-slate-50 text-slate-300 line-through' : 'bg-blue-50 text-blue-600 border border-blue-100'}` }, t.text))
                                        )
                                    );
                                })
                            )
                        ) :
                        createElement('div', { className: 'max-w-3xl mx-auto animate-in slide-in-from-bottom' },
                            createElement('div', { className: 'bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100' },
                                createElement('div', { className: 'p-12 bg-gradient-to-br from-blue-600 to-indigo-700 text-white relative' },
                                    createElement('button', { onClick: () => setView('month'), className: 'mb-8 flex items-center text-blue-100 hover:text-white font-bold text-sm transition-colors' }, createElement(Icon, { name: 'ChevronLeft', className: 'w-5 h-5 mr-1' }), '返回月历'),
                                    createElement('h2', { className: 'text-7xl font-black tracking-tighter' }, selectedDate.split('-')[2], createElement('span', { className: 'text-2xl ml-3 opacity-60 font-normal italic' }, `/ 周${WEEK_DAYS[new Date(selectedDate).getDay()]}`))
                                ),
                                createElement('div', { className: 'p-10 grid grid-cols-1 md:grid-cols-12 gap-10' },
                                    createElement('div', { className: 'md:col-span-4 space-y-4' },
                                        createElement('h3', { className: 'text-slate-400 font-black text-[10px] uppercase tracking-widest mb-2 px-1' }, '习惯打卡'),
                                        createElement('button', { onClick: () => toggleHabit('earlyRise'), className: `w-full flex flex-col p-5 rounded-[1.5rem] border transition-all ${habits[selectedDate]?.earlyRise ? 'bg-orange-50 border-orange-100 text-orange-700' : 'bg-slate-50 border-transparent text-slate-400 hover:border-slate-200'}` }, 
                                            createElement(Icon, { name: 'Sun', className: `w-8 h-8 mb-2 ${habits[selectedDate]?.earlyRise ? 'text-orange-500' : ''}` }),
                                            createElement('div', { className: 'font-black text-sm' }, '晨曦早起'),
                                            createElement('div', { className: 'text-[10px] opacity-60 mt-1' }, `累计 ${habitCount('earlyRise')} 天`)
                                        ),
                                        createElement('button', { onClick: () => toggleHabit('english'), className: `w-full flex flex-col p-5 rounded-[1.5rem] border transition-all ${habits[selectedDate]?.english ? 'bg-blue-50 border-blue-100 text-blue-700' : 'bg-slate-50 border-transparent text-slate-400 hover:border-slate-200'}` }, 
                                            createElement(Icon, { name: 'Languages', className: `w-8 h-8 mb-2 ${habits[selectedDate]?.english ? 'text-blue-500' : ''}` }),
                                            createElement('div', { className: 'font-black text-sm' }, '英语研习'),
                                            createElement('div', { className: 'text-[10px] opacity-60 mt-1' }, `累计 ${habitCount('english')} 天`)
                                        )
                                    ),
                                    createElement('div', { className: 'md:col-span-8' },
                                        createElement('h3', { className: 'text-slate-400 font-black text-[10px] uppercase tracking-widest mb-6 px-1' }, '待办事项'),
                                        createElement('div', { className: 'flex space-x-3 mb-8' },
                                            createElement('input', { type: 'text', value: newTask, onChange: e => setNewTask(e.target.value), onKeyPress: e => e.key === 'Enter' && addTask(), placeholder: '有什么新计划？', className: 'flex-1 bg-slate-50 rounded-2xl px-5 py-4 outline-none border-2 border-transparent focus:border-blue-500 focus:bg-white transition-all text-sm font-medium' }),
                                            createElement('button', { onClick: addTask, className: 'bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all' }, createElement(Icon, { name: 'Plus', className: 'w-6 h-6' }))
                                        ),
                                        createElement('div', { className: 'space-y-3' },
                                            (tasks[selectedDate] || []).map(t => createElement('div', { key: t.id, className: `group flex items-center justify-between p-5 rounded-2xl transition-all ${t.completed ? 'bg-slate-50 opacity-60' : 'bg-white border border-slate-100 shadow-sm hover:border-blue-100'}` },
                                                createElement('div', { className: 'flex items-center space-x-4' },
                                                    createElement('button', { onClick: () => toggleTask(t.id) }, createElement(Icon, { name: t.completed ? 'CheckCircle' : 'Circle', className: `w-6 h-6 ${t.completed ? 'text-green-500' : 'text-slate-200 hover:text-blue-400'}` })),
                                                    createElement('span', { className: `text-base font-medium ${t.completed ? 'line-through text-slate-300' : 'text-slate-700'}` }, t.text)
                                                ),
                                                createElement('button', { onClick: () => deleteTask(t.id), className: 'text-slate-200 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-2' }, createElement(Icon, { name: 'Trash2', className: 'w-5 h-5' }))
                                            ))
                                        )
                                    )
                                )
                            )
                        )
                    ),

                    // Status Bar
                    createElement('footer', { className: 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl px-10 py-5 rounded-full shadow-2xl border border-slate-100 flex items-center space-x-10 z-50' },
                        createElement('div', { className: 'flex items-center text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]' },
                            syncStatus === 'syncing' ? createElement(Icon, { name: 'Loader2', className: 'w-4 h-4 animate-spin mr-2 text-blue-500' }) : 
                            createElement(Icon, { name: 'Cloud', className: 'w-4 h-4 mr-2 text-green-500' }),
                            createElement('span', null, syncStatus === 'syncing' ? '同步中' : '云端已同步')
                        ),
                        createElement('div', { className: 'w-px h-6 bg-slate-100 hidden sm:block' }),
                        createElement('div', { className: 'flex items-center space-x-6' },
                            createElement('div', { className: 'flex items-center' }, createElement(Icon, { name: 'Sun', className: 'w-5 h-5 text-orange-500 mr-2' }), createElement('span', { className: 'font-black text-slate-700' }, habitCount('earlyRise'))),
                            createElement('div', { className: 'flex items-center' }, createElement(Icon, { name: 'Languages', className: 'w-5 h-5 text-blue-500 mr-2' }), createElement('span', { className: 'font-black text-slate-700' }, habitCount('english'))),
                            createElement('div', { className: 'flex items-center text-green-500' }, createElement(Icon, { name: 'Trophy', className: 'w-5 h-5 mr-2' }), createElement('span', { className: 'font-black text-slate-700' }, Object.values(tasks).flat().filter(t => t.completed).length))
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(createElement(App));
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; background: #f8fafc; font-family: 'Inter', 'PingFang SC', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .animate-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 移动端图标强制显示大小 */
        [data-lucide] { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
